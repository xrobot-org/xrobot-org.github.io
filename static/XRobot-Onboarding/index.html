<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>学习路线引导</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Apply the theme before the first paint: the main site's choice ("theme", Docusaurus),
    // then this page's earlier key, then the system setting. onboarding.js keeps them in sync.
    (function () {
      var theme = null;
      try {
        var keys = ["theme", "xrobot_onboarding_theme"];
        for (var i = 0; i < keys.length && !theme; i++) {
          var v = localStorage.getItem(keys[i]);
          if (v === "light" || v === "dark") theme = v;
        }
      } catch (e) {}
      if (!theme) theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root,
    html[data-theme='light'] {
      color-scheme: light;
      --paper: #f2f3f2;
      --paper-raised: #ffffff;
      --paper-sunken: #e6e8e6;
      --line: #d3d6d3;
      --line-strong: #7c827e;
      --ink: #111312;
      --ink-muted: #4d524f;
      --on-ink: #f2f3f2;
      --pass: #16693a;
      --fail: #b42318;
      --duration-fast: 80ms;
      --duration-base: 160ms;
    }

    html[data-theme='dark'] {
      color-scheme: dark;
      --paper: #0c0e0d;
      --paper-raised: #151816;
      --paper-sunken: #070908;
      --line: #2a2e2c;
      --line-strong: #6f7672;
      --ink: #e6e8e6;
      --ink-muted: #a3a9a5;
      --on-ink: #0c0e0d;
      --pass: #5bd68a;
      --fail: #ff8a7a;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
      transition: background var(--duration-base) ease, color var(--duration-base) ease;
    }

    h1 {
      margin-bottom: 4px;
    }

    .page-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .page-heading {
      flex: 1;
      min-width: 0;
    }

    .subtitle {
      color: var(--ink-muted);
      margin-bottom: 0;
      font-size: 14px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 0;
      background: var(--paper-raised);
      border: 1px solid var(--line);
      flex-shrink: 0;
    }

    .theme-toggle button {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--ink);
      border-radius: 0;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background var(--duration-base) ease, color var(--duration-base) ease;
    }

    .theme-toggle button:hover {
      background: var(--ink);
      color: var(--on-ink);
    }

    .theme-toggle button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .theme-toggle-icon {
      width: 20px;
      height: 20px;
      display: block;
    }

    .theme-toggle-icon--moon {
      display: none;
    }

    html[data-theme='dark'] .theme-toggle-icon--sun {
      display: none;
    }

    html[data-theme='dark'] .theme-toggle-icon--moon {
      display: block;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .card {
      background: var(--paper-raised);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .node-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .node-subtitle {
      font-size: 13px;
      color: var(--ink-muted);
      margin-bottom: 10px;
    }

    .choice-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .choice-btn {
      border-radius: 0;
      border: 1px solid var(--line);
      padding: 10px 12px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: background var(--duration-base) ease, color var(--duration-base) ease, border-color var(--duration-base) ease;
    }

    .choice-btn:hover {
      background: var(--ink);
      color: var(--on-ink);
      border-color: var(--ink);
    }

    .choice-btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .choice-title {
      font-weight: 600;
      font-size: 14px;
    }

    .choice-desc {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 2px;
      transition: color var(--duration-base) ease;
    }

    .choice-btn:hover .choice-desc {
      color: var(--on-ink);
      opacity: 0.85;
    }

    .choice-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--paper);
      margin-top: 6px;
    }

    .task-list {
      margin-top: 8px;
    }

    .task-title-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .task-estimate {
      font-size: 11px;
      color: var(--ink-muted);
      margin-left: 8px;
    }

    .task-item input[type="checkbox"] {
      margin-top: 4px;
      accent-color: var(--ink);
    }

    .task-main {
      font-size: 14px;
    }

    .task-title {
      font-weight: 600;
    }

    .task-desc {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 4px;
      white-space: normal;
    }

    .task-link a {
      font-size: 12px;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .task-link a:hover {
      color: var(--ink-muted);
    }

    .task-meta {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .progress-wrap {
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      height: 10px;
      border-radius: 0;
      border: 1px solid var(--line);
      background: var(--paper-sunken);
      overflow: hidden;
    }

    .progress-bar-fg {
      height: 100%;
      width: 0%;
      background: var(--pass);
      transition: width var(--duration-base) ease;
    }

    .progress-text {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 13px;
    }

    .nav-btn {
      border: none;
      background: none;
      color: var(--ink);
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .nav-btn:hover {
      color: var(--ink-muted);
    }

    .small-text {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 12px;
    }

    .tags {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 0;
      border: 1px solid var(--line);
      background: var(--paper-raised);
      color: var(--ink-muted);
      margin-right: 6px;
    }

    #app-error {
      color: var(--fail);
      font-size: 14px;
      margin-top: 16px;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      .page-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .theme-toggle {
        align-self: flex-end;
      }
    }
  </style>
</head>

<body>
  <div class="page-toolbar">
    <div class="page-heading">
      <h1 id="page-title">学习路线引导</h1>
      <div class="subtitle" id="page-subtitle">
        加载配置中……
      </div>
    </div>

    <div class="theme-toggle">
      <button type="button" id="theme-toggle-button" aria-label="切换到深色模式" title="切换到深色模式">
        <span class="sr-only" id="theme-toggle-text">切换到深色模式</span>
        <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12Zm0-16a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 18a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1Zm10-9a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2h2ZM4 12a1 1 0 1 1 0 2H2a1 1 0 1 1 0-2h2Zm15.07 6.66a1 1 0 0 1 1.41 1.41l-.7.71a1 1 0 0 1-1.42-1.41l.71-.71ZM5.64 5.64a1 1 0 0 1 1.41 0 1 1 0 0 1 0 1.41l-.71.71A1 1 0 0 1 4.93 6.35l.71-.71Zm13.43 0 .71.71a1 1 0 1 1-1.41 1.41l-.71-.71a1 1 0 0 1 1.41-1.41ZM6.34 18.36l.71.71a1 1 0 0 1-1.41 1.41l-.71-.71a1 1 0 0 1 1.41-1.41Z"/>
        </svg>
        <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M21.75 15.5A9 9 0 1 1 12.5 2.25a1 1 0 0 1 .9 1.55A7 7 0 0 0 20.2 14.6a1 1 0 0 1 1.55.9Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="app"></div>
  <div id="app-error"></div>

  <div class="small-text">
    进度保存在本地浏览器（localStorage），只对当前设备生效。<br />
    想重新选择路线，可以点击「返回起点」。
  </div>
  <!-- 新增：markdown 解析库 -->
  <script src="marked.min.js"></script>
  <script src="onboarding.js"></script>
</body>

</html>
